<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DriveRadar: AI placement-drive radar for my batch.">
  <style>
    .fade { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none !important; opacity: 1 !important; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg-driveradar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060814"/><stop offset="1" stop-color="#0C1028"/></linearGradient>
    <linearGradient id="pg-driveradar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#10B981"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;460;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sw-driveradar" x1="0" x2="1"><stop offset="0" stop-color="#10B981"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <filter id="b-driveradar" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="c-driveradar"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c-driveradar)">
    <rect width="1200" height="300" fill="url(#bg-driveradar)"/>
    <circle cx="1060" cy="60" r="180" fill="#22D3EE" opacity="0.17" filter="url(#b-driveradar)">
      <animate attributeName="cx" values="1060;920;1060" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="300" r="150" fill="#6366F1" opacity="0.12" filter="url(#b-driveradar)">
      <animate attributeName="cy" values="300;240;300" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#1E2647" stroke-width="2"/>
  <rect class="motion" x="2" y="2" width="1196" height="296" rx="20" fill="none" stroke="url(#sw-driveradar)" stroke-width="2" stroke-opacity=".75"
        stroke-dasharray="477 2507" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2984" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g class="fade" style="animation-delay:.05s">
    <text x="56" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" font-weight="700" fill="#22D3EE" letter-spacing="2">03 /</text>
    <rect x="112" y="40" width="122" height="32" rx="16" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".45"/>
    <circle cx="129" cy="56" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="142" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="14.5" font-weight="700" fill="#34D399" letter-spacing="1">LIVE · AI</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <text x="53" y="132" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#pg-driveradar)">DriveRadar</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="56" y="172" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="24" font-weight="600" fill="#F4F5FB">AI placement-drive radar for my batch.</text>
    <text x="56" y="204" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="18" fill="#A3ABC8">Guarded LLM extraction · eligibility engine · Telegram alerts</text>
  </g>
  
    <g class="fade" style="animation-delay:0.50s">
      <rect x="780" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="842" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-driveradar)">99%</text>
      <text x="842" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">backend test</text><text x="842" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">coverage</text>
    </g>
    <g class="fade" style="animation-delay:0.65s">
      <rect x="914" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="976" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="27" font-weight="800" fill="url(#pg-driveradar)">24h·3h</text>
      <text x="976" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">deadline</text><text x="976" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">alerts</text>
    </g>
    <g class="fade" style="animation-delay:0.80s">
      <rect x="1048" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="1110" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-driveradar)">1×</text>
      <text x="1110" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">exactly-once</text><text x="1110" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">reminders</text>
    </g>
  <g class="fade" style="animation-delay:0.80s"><rect x="56" y="228" width="81" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="97" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Python</text></g><g class="fade" style="animation-delay:0.86s"><rect x="146" y="228" width="90" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="191" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">FastAPI</text></g><g class="fade" style="animation-delay:0.92s"><rect x="246" y="228" width="118" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="305" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">SQLAlchemy</text></g><g class="fade" style="animation-delay:0.98s"><rect x="373" y="228" width="118" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="432" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">PostgreSQL</text></g><g class="fade" style="animation-delay:1.04s"><rect x="500" y="228" width="72" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="536" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">React</text></g><g class="fade" style="animation-delay:1.10s"><rect x="581" y="228" width="118" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="640" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">TypeScript</text></g><g class="fade" style="animation-delay:1.16s"><rect x="708" y="228" width="54" height="36" rx="18" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/><text x="734" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">LLM</text></g>
</svg>
