<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="CricketVerse Arena: 3D online cricket with friends, in the browser.">
  <style>
    .fade { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none !important; opacity: 1 !important; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg-cricketverse" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060814"/><stop offset="1" stop-color="#0C1028"/></linearGradient>
    <linearGradient id="pg-cricketverse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FACC15"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;460;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sw-cricketverse" x1="0" x2="1"><stop offset="0" stop-color="#FACC15"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <filter id="b-cricketverse" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="c-cricketverse"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c-cricketverse)">
    <rect width="1200" height="300" fill="url(#bg-cricketverse)"/>
    <circle cx="1060" cy="60" r="180" fill="#F59E0B" opacity="0.17" filter="url(#b-cricketverse)">
      <animate attributeName="cx" values="1060;920;1060" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="300" r="150" fill="#10B981" opacity="0.12" filter="url(#b-cricketverse)">
      <animate attributeName="cy" values="300;240;300" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#1E2647" stroke-width="2"/>
  <rect class="motion" x="2" y="2" width="1196" height="296" rx="20" fill="none" stroke="url(#sw-cricketverse)" stroke-width="2" stroke-opacity=".75"
        stroke-dasharray="477 2507" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2984" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g class="fade" style="animation-delay:.05s">
    <text x="56" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" font-weight="700" fill="#F59E0B" letter-spacing="2">04 /</text>
    <rect x="112" y="40" width="254" height="32" rx="16" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".45"/>
    <circle cx="129" cy="56" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="142" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="14.5" font-weight="700" fill="#34D399" letter-spacing="1">DEPLOYED · OPEN SOURCE</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <text x="53" y="132" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#pg-cricketverse)">CricketVerse Arena</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="56" y="172" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="24" font-weight="600" fill="#F4F5FB">3D online cricket with friends, in the browser.</text>
    <text x="56" y="204" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="18" fill="#A3ABC8">Private rooms · authoritative game server · ball physics</text>
  </g>
  
    <g class="fade" style="animation-delay:0.50s">
      <rect x="780" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="842" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="27" font-weight="800" fill="url(#pg-cricketverse)">11v11</text>
      <text x="842" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">players per</text><text x="842" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">side, or 1v1</text>
    </g>
    <g class="fade" style="animation-delay:0.65s">
      <rect x="914" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="976" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-cricketverse)">30</text>
      <text x="976" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">overs, max</text><text x="976" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">per innings</text>
    </g>
    <g class="fade" style="animation-delay:0.80s">
      <rect x="1048" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="1110" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-cricketverse)">₹0</text>
      <text x="1110" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">infra per</text><text x="1110" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">month</text>
    </g>
  <g class="fade" style="animation-delay:0.80s"><rect x="56" y="228" width="100" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="106" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">React 19</text></g><g class="fade" style="animation-delay:0.86s"><rect x="165" y="228" width="118" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="224" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">TypeScript</text></g><g class="fade" style="animation-delay:0.92s"><rect x="292" y="228" width="100" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="341" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Three.js</text></g><g class="fade" style="animation-delay:0.98s"><rect x="400" y="228" width="109" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="455" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Socket.IO</text></g><g class="fade" style="animation-delay:1.04s"><rect x="518" y="228" width="90" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="563" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Node.js</text></g><g class="fade" style="animation-delay:1.10s"><rect x="617" y="228" width="63" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="649" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Vite</text></g><g class="fade" style="animation-delay:1.16s"><rect x="689" y="228" width="81" height="36" rx="18" fill="#F59E0B" fill-opacity=".12" stroke="#F59E0B" stroke-opacity=".4"/><text x="730" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Docker</text></g>
</svg>
