<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="RelayForge: Durable webhook relay. No event is ever lost.">
  <style>
    .fade { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none !important; opacity: 1 !important; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg-relayforge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFAFF"/><stop offset="1" stop-color="#F1EEFF"/></linearGradient>
    <linearGradient id="pg-relayforge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#38BDF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;460;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sw-relayforge" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#6366F1"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <filter id="b-relayforge" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="c-relayforge"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c-relayforge)">
    <rect width="1200" height="300" fill="url(#bg-relayforge)"/>
    <circle cx="1060" cy="60" r="180" fill="#6366F1" opacity="0.15" filter="url(#b-relayforge)">
      <animate attributeName="cx" values="1060;920;1060" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="300" r="150" fill="#38BDF8" opacity="0.11" filter="url(#b-relayforge)">
      <animate attributeName="cy" values="300;240;300" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#E4E0F5" stroke-width="2"/>
  <rect class="motion" x="2" y="2" width="1196" height="296" rx="20" fill="none" stroke="url(#sw-relayforge)" stroke-width="2" stroke-opacity=".75"
        stroke-dasharray="477 2507" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2984" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g class="fade" style="animation-delay:.05s">
    <text x="56" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" font-weight="700" fill="#6366F1" letter-spacing="2">01 /</text>
    <rect x="112" y="40" width="224" height="32" rx="16" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".45"/>
    <circle cx="129" cy="56" r="5" fill="#059669"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="142" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="14.5" font-weight="700" fill="#059669" letter-spacing="1">DEPLOYED · FLAGSHIP</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <text x="53" y="132" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#pg-relayforge)">RelayForge</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="56" y="172" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="24" font-weight="600" fill="#12142B">Durable webhook relay. No event is ever lost.</text>
    <text x="56" y="204" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="18" fill="#4B5170">Outbox · Postgres queue with leases · SSRF-safe signed delivery</text>
  </g>
  
    <g class="fade" style="animation-delay:0.50s">
      <rect x="780" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="842" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-relayforge)">555</text>
      <text x="842" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">tests on real</text><text x="842" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">Postgres</text>
    </g>
    <g class="fade" style="animation-delay:0.65s">
      <rect x="914" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="976" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="27" font-weight="800" fill="url(#pg-relayforge)">665/s</text>
      <text x="976" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">peak ingest,</text><text x="976" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">local k6</text>
    </g>
    <g class="fade" style="animation-delay:0.80s">
      <rect x="1048" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="1110" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-relayforge)">100%</text>
      <text x="1110" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">delivered in</text><text x="1110" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#4B5170">crash test</text>
    </g>
  <g class="fade" style="animation-delay:0.80s"><rect x="56" y="228" width="118" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="115" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">Node.js 24</text></g><g class="fade" style="animation-delay:0.86s"><rect x="183" y="228" width="118" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="242" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">TypeScript</text></g><g class="fade" style="animation-delay:0.92s"><rect x="310" y="228" width="90" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="355" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">Fastify</text></g><g class="fade" style="animation-delay:0.98s"><rect x="409" y="228" width="118" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="468" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">PostgreSQL</text></g><g class="fade" style="animation-delay:1.04s"><rect x="536" y="228" width="90" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="582" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">Drizzle</text></g><g class="fade" style="animation-delay:1.10s"><rect x="636" y="228" width="72" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="672" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">React</text></g><g class="fade" style="animation-delay:1.16s"><rect x="717" y="228" width="81" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="757" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">Docker</text></g><g class="fade" style="animation-delay:1.22s"><rect x="807" y="228" width="44" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#6366F1" stroke-opacity=".4"/><text x="829" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#12142B">k6</text></g>
</svg>
