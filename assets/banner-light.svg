      <stop offset="0" stop-color="#6D3AF0"/><stop offset=".35" stop-color="#0891B2"/>
      <stop offset=".7" stop-color="#DB2777"/><stop offset="1" stop-color="#6D3AF0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;700;0" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#0891B2"/><stop offset=".6" stop-color="#6D3AF0"/><stop offset="1" stop-color="#6D3AF0" stop-opacity="0"/></radialGradient>
