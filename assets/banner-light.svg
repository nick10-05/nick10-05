<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Nikhil Chandrakanti: full-stack engineer who ships software real people use. Projects: RelayForge, HostelConnect, DriveRadar.">
  <style>
    .fade { opacity: 0; animation: in .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: role 12s infinite; }
    @keyframes role { 0% { opacity: 0; transform: translateY(12px); } 4%,29% { opacity: 1; transform: none; }
                      33%,100% { opacity: 0; transform: translateY(-12px); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
