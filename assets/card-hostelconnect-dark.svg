<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="HostelConnect: Replaced my hostel&#x27;s WhatsApp chaos.">
  <style>
    .fade { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none !important; opacity: 1 !important; } .motion { display: none; } }
  </style>
  <defs>
    <linearGradient id="bg-hostelconnect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060814"/><stop offset="1" stop-color="#0C1028"/></linearGradient>
    <linearGradient id="pg-hostelconnect" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="460" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FB923C"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;460;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sw-hostelconnect" x1="0" x2="1"><stop offset="0" stop-color="#FB923C"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="b-hostelconnect" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="c-hostelconnect"><rect width="1200" height="300" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#c-hostelconnect)">
    <rect width="1200" height="300" fill="url(#bg-hostelconnect)"/>
    <circle cx="1060" cy="60" r="180" fill="#EC4899" opacity="0.17" filter="url(#b-hostelconnect)">
      <animate attributeName="cx" values="1060;920;1060" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="300" r="150" fill="#8B5CF6" opacity="0.12" filter="url(#b-hostelconnect)">
      <animate attributeName="cy" values="300;240;300" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#1E2647" stroke-width="2"/>
  <rect class="motion" x="2" y="2" width="1196" height="296" rx="20" fill="none" stroke="url(#sw-hostelconnect)" stroke-width="2" stroke-opacity=".75"
        stroke-dasharray="477 2507" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2984" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g class="fade" style="animation-delay:.05s">
    <text x="56" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" font-weight="700" fill="#EC4899" letter-spacing="2">02 /</text>
    <rect x="112" y="40" width="203" height="32" rx="16" fill="#34D399" fill-opacity=".12" stroke="#34D399" stroke-opacity=".45"/>
    <circle cx="129" cy="56" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="142" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="14.5" font-weight="700" fill="#34D399" letter-spacing="1">LIVE · REAL USERS</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <text x="53" y="132" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#pg-hostelconnect)">HostelConnect</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="56" y="172" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="24" font-weight="600" fill="#F4F5FB">Replaced my hostel&#x27;s WhatsApp chaos.</text>
    <text x="56" y="204" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="18" fill="#A3ABC8">Complaints · notices · UPI fees · polls · up to 200 students</text>
  </g>
  
    <g class="fade" style="animation-delay:0.50s">
      <rect x="780" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="842" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-hostelconnect)">160+</text>
      <text x="842" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">test files</text>
    </g>
    <g class="fade" style="animation-delay:0.65s">
      <rect x="914" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="976" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-hostelconnect)">24</text>
      <text x="976" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">SQL</text><text x="976" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">migrations</text>
    </g>
    <g class="fade" style="animation-delay:0.80s">
      <rect x="1048" y="40" width="124" height="132" rx="18" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="1110" y="96" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="34" font-weight="800" fill="url(#pg-hostelconnect)">₹0</text>
      <text x="1110" y="128" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">infra per</text><text x="1110" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="15.5" fill="#A3ABC8">month</text>
    </g>
  <g class="fade" style="animation-delay:0.80s"><rect x="56" y="228" width="72" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="92" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">React</text></g><g class="fade" style="animation-delay:0.86s"><rect x="137" y="228" width="118" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="196" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">TypeScript</text></g><g class="fade" style="animation-delay:0.92s"><rect x="264" y="228" width="90" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="309" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Express</text></g><g class="fade" style="animation-delay:0.98s"><rect x="363" y="228" width="118" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="422" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">PostgreSQL</text></g><g class="fade" style="animation-delay:1.04s"><rect x="490" y="228" width="100" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="540" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Supabase</text></g><g class="fade" style="animation-delay:1.10s"><rect x="599" y="228" width="100" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="649" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Tailwind</text></g><g class="fade" style="animation-delay:1.16s"><rect x="708" y="228" width="81" height="36" rx="18" fill="#EC4899" fill-opacity=".12" stroke="#EC4899" stroke-opacity=".4"/><text x="748" y="252" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15.5" fill="#F4F5FB">Docker</text></g>
</svg>
