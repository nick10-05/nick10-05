<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="HostelConnect: Replaced my hostel&#x27;s WhatsApp chaos with an owner-first app.">
  <style>
    .fade { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <defs>
    <linearGradient id="bg-hostelconnect" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFAFF"/><stop offset="1" stop-color="#F1EEFF"/></linearGradient>
    <linearGradient id="pg-hostelconnect" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FB923C"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;420;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sw-hostelconnect" x1="0" x2="1"><stop offset="0" stop-color="#FB923C"/><stop offset=".5" stop-color="#EC4899"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="b-hostelconnect" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="c-hostelconnect"><rect width="1200" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c-hostelconnect)">
    <rect width="1200" height="260" fill="url(#bg-hostelconnect)"/>
    <circle cx="1080" cy="40" r="170" fill="#EC4899" opacity="0.17" filter="url(#b-hostelconnect)">
      <animate attributeName="cx" values="1080;900;1080" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="140" fill="#8B5CF6" opacity="0.13" filter="url(#b-hostelconnect)">
      <animate attributeName="cy" values="260;200;260" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="19" fill="none" stroke="#E4E0F5" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="256" rx="18" fill="none" stroke="url(#sw-hostelconnect)" stroke-width="2.5"
        stroke-dasharray="523 2381" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-2904" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g class="fade" style="animation-delay:.05s">
    <text x="56" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="14" font-weight="700" fill="#EC4899" letter-spacing="2">02 /</text>
    <rect x="104" y="44" width="177" height="26" rx="13" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".45"/>
    <circle cx="119" cy="57" r="4" fill="#059669"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="130" y="62" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12" font-weight="700" fill="#059669" letter-spacing="1">LIVE · REAL USERS</text>
  </g>
  <g class="fade" style="animation-delay:.2s">
    <text x="54" y="118" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="46" font-weight="800" letter-spacing="-1" fill="url(#pg-hostelconnect)">HostelConnect</text>
  </g>
  <g class="fade" style="animation-delay:.35s">
    <text x="56" y="150" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="19" font-weight="600" fill="#12142B">Replaced my hostel&#x27;s WhatsApp chaos with an owner-first app.</text>
    <text x="56" y="176" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="14" fill="#4B5170">2 buildings · up to 200 students · complaints, notices, fees with UPI, return polls</text>
  </g>
  
    <g class="fade" style="animation-delay:0.50s">
      <rect x="812" y="58" width="116" height="104" rx="16" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="870" y="106" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="28" font-weight="800" fill="url(#pg-hostelconnect)">160+</text>
      <text x="870" y="132" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="11.5" fill="#4B5170">test files</text>
    </g>
    <g class="fade" style="animation-delay:0.65s">
      <rect x="940" y="58" width="116" height="104" rx="16" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="998" y="106" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="28" font-weight="800" fill="url(#pg-hostelconnect)">24</text>
      <text x="998" y="132" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="11.5" fill="#4B5170">SQL migrations ·</text><text x="998" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="11.5" fill="#4B5170">RLS</text>
    </g>
    <g class="fade" style="animation-delay:0.80s">
      <rect x="1068" y="58" width="116" height="104" rx="16" fill="#FFFFFF" fill-opacity=".65" stroke="#FFFFFF" stroke-opacity=".9"/>
      <text x="1126" y="106" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="28" font-weight="800" fill="url(#pg-hostelconnect)">₹0</text>
      <text x="1126" y="132" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="11.5" fill="#4B5170">a month,</text><text x="1126" y="147" text-anchor="middle" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="11.5" fill="#4B5170">encrypted backups</text>
    </g>
  <g class="fade" style="animation-delay:0.80s"><rect x="56" y="196" width="81" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="97" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">React 19</text></g><g class="fade" style="animation-delay:0.86s"><rect x="145" y="196" width="96" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="193" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">TypeScript</text></g><g class="fade" style="animation-delay:0.92s"><rect x="249" y="196" width="89" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="294" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">Express 5</text></g><g class="fade" style="animation-delay:0.98s"><rect x="346" y="196" width="96" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="394" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">PostgreSQL</text></g><g class="fade" style="animation-delay:1.04s"><rect x="450" y="196" width="81" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="490" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">Supabase</text></g><g class="fade" style="animation-delay:1.10s"><rect x="539" y="196" width="96" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="587" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">Tailwind 4</text></g><g class="fade" style="animation-delay:1.16s"><rect x="643" y="196" width="66" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="676" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">Docker</text></g><g class="fade" style="animation-delay:1.22s"><rect x="717" y="196" width="74" height="28" rx="14" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".35"/><text x="754" y="215" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12.5" fill="#12142B">Actions</text></g>
</svg>
