<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Nikhil Chandrakanti, full-stack engineer who ships software real people use">
  <style>
    .fade { opacity: 0; animation: in .8s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d4 { animation-delay: 3.1s; } .d5 { animation-delay: .9s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1A2236" stroke-width="1"/>
    </pattern>
    <linearGradient id="veil" x1="0" x2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset=".45" stop-color="#0B1020" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F2F4F8"/>
      <stop offset=".45" stop-color="#F2F4F8"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F2F4F8"/>
      <stop offset="1" stop-color="#F2F4F8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0;1400;1400" keyTimes="0;0.35;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5A524" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F5A524" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="type"><rect x="64" y="166" height="32" width="0"><animate attributeName="width" values="0.0;11.4;22.8;34.2;45.6;57.0;68.4;79.8;91.2;102.6;114.0;125.4;136.8;148.2;159.6;171.0;182.4;193.8;205.2;216.6;228.0;239.4;250.8;262.2;273.6;285.0;296.4;307.8;319.2;330.6;342.0;353.4;364.8;376.2;387.6;399.0;410.4;421.8;433.2;444.6;456.0;467.4;478.8;490.2;501.6;513.0;524.4;535.8;547.2;558.6;570.0;581.4;592.8;604.2" dur="1.86s" begin="1.2s" fill="freeze" calcMode="discrete"/></rect></clipPath>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0B1020"/>
  <rect width="1200" height="300" rx="16" fill="url(#g)"/>
  <circle cx="920" cy="150" r="260" fill="url(#glow)">
    <animate attributeName="r" values="240;280;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect width="1200" height="300" rx="16" fill="url(#veil)"/>

  <g class="fade d1">
    <text x="64" y="86" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="18" fill="#F5A524">~/nick10-05 $ <tspan fill="#9AA4B8">whoami</tspan><tspan class="cursor"> ▍</tspan></text>
  </g>
  <g class="fade d2">
    <text x="62" y="146" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="52" font-weight="700" fill="url(#shine)" letter-spacing="-1">Nikhil Chandrakanti</text>
  </g>
  <g clip-path="url(#type)">
    <text x="64" y="188" font-family='-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif' font-size="22" fill="#9AA4B8">Full-stack engineer. I ship software <tspan fill="#F2F4F8" font-weight="600">real people use.</tspan></text>
  </g>
  <g class="fade d4">
    <text x="64" y="236" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15" fill="#5B667D">React · Node.js · TypeScript · PostgreSQL · Hyderabad, IN</text>
  </g>

  <g class="fade d5">
    <text x="718" y="92" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="13" fill="#5B667D">// every change: PR → CI → deploy</text>
    <path id="p" d="M740 150 H1100" stroke="#2A3550" stroke-width="2" stroke-dasharray="4 6" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
    </path>
    
    <circle cx="740" cy="150" r="22" fill="#141B2E" stroke="#2A3550" stroke-width="2">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.00;1"/>
    </circle>
    <circle cx="740" cy="150" r="6" fill="#2A3550">
      <animate attributeName="fill" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.00;1"/>
    </circle>
    <text x="740" y="200" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15" fill="#9AA4B8">commit</text>
    <circle cx="860" cy="150" r="22" fill="#141B2E" stroke="#2A3550" stroke-width="2">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.25;1"/>
    </circle>
    <circle cx="860" cy="150" r="6" fill="#2A3550">
      <animate attributeName="fill" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.25;1"/>
    </circle>
    <text x="860" y="200" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15" fill="#9AA4B8">test</text>
    <circle cx="980" cy="150" r="22" fill="#141B2E" stroke="#2A3550" stroke-width="2">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.50;1"/>
    </circle>
    <circle cx="980" cy="150" r="6" fill="#2A3550">
      <animate attributeName="fill" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.50;1"/>
    </circle>
    <text x="980" y="200" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15" fill="#9AA4B8">deploy</text>
    <circle cx="1100" cy="150" r="22" fill="#141B2E" stroke="#2A3550" stroke-width="2">
      <animate attributeName="stroke" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.75;1"/>
    </circle>
    <circle cx="1100" cy="150" r="6" fill="#2A3550">
      <animate attributeName="fill" dur="4s" repeatCount="indefinite" calcMode="discrete"
        values="#2A3550;#34D399;#2A3550" keyTimes="0;0.75;1"/>
    </circle>
    <text x="1100" y="200" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="15" fill="#9AA4B8">live</text>
    
    <circle cx="1100" cy="150" r="22" fill="none" stroke="#34D399" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="4s" repeatCount="indefinite" values="22;22;44" keyTimes="0;0.75;1"/>
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0.9;0" keyTimes="0;0.75;1"/>
    </circle>
    <circle r="5" fill="#F5A524">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.75;1" calcMode="linear">
        <mpath href="#p"/>
      </animateMotion>
    </circle>
    <text x="1100" y="222" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace' font-size="12" fill="#34D399">200 users</text>
  </g>
</svg>
